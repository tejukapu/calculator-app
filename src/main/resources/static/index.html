<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Calculator</title>

<style>
body {
    background: radial-gradient(circle at top, #1f2937, #020617);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
}

.calculator {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 20px;
    width: 320px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.display {
    background: #020617;
    color: #22d3ee;
    font-size: 32px;
    text-align: right;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    min-height: 50px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 18px;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: rgba(255,255,255,0.25);
}

.operator {
    color: #38bdf8;
}

.equal {
    background: #22d3ee;
    color: black;
    grid-column: span 2;
}

.clear {
    color: #f87171;
}
</style>
</head>

<body>

<div class="calculator">
    <div class="display" id="display">0</div>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="append('%')">%</button>
        <button onclick="setOp('divide')" class="operator">÷</button>
        <button onclick="setOp('multiply')" class="operator">×</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="setOp('subtract')" class="operator">−</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="setOp('add')" class="operator">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
let first = '';
let second = '';
let operation = null;
let display = document.getElementById("display");

function append(value) {
    if (!operation) {
        first += value;
        display.innerText = first;
    } else {
        second += value;
        display.innerText = second;
    }
}

function setOp(op) {
    if (!first) return;
    operation = op;
}

function clearDisplay() {
    first = '';
    second = '';
    operation = null;
    display.innerText = '0';
}

function calculate() {
    if (!first || !second || !operation) return;

    fetch(`/${operation}?a=${first}&b=${second}`)
        .then(res => res.text())
        .then(result => {
            display.innerText = result;
            first = result;
            second = '';
            operation = null;
        })
        .catch(() => {
            display.innerText = 'Error';
        });
}
</script>

</body>
</html>
